name: build vienna GKI LIMPO (common puro, Path B)

# Path B: GKI `common` PURO @d77c4cd65aed, com a WORKSPACE PADRAO do AOSP (SEM o bazel.WORKSPACE da MTK).
# Motivo: os 3 builds da esteira MTK panicam identico no page allocator MESMO PELADOS (sem KSU/SUSFS), e a
# config bate 100% com o device (VA_BITS/MTE/hardening idem) -> a causa e o BINARIO (arvore/WORKSPACE MTK),
# nao config. A comunidade builda //common:kernel_aarch64 e boota. Este build e a variante de controle:
# common puro PELADO. Se bootar, confirma que era a esteira MTK e seguimos p/ +KSU +SUSFS no common.
# Vermagic sai LIMPO do git (checkout do commit d77c4cd65aed -> -gd77c4cd65aed), sem hack .scmversion.
on:
  workflow_dispatch:
    inputs:
      gki_tag:
        description: "Tag do GKI common do stock (= d77c4cd65aed, 6.1.141)"
        default: "android14-6.1-2025-07_r11"
      manifest_branch:
        default: "common-android14-6.1"
      target:
        description: "Alvo Bazel GKI padrao"
        default: "//common:kernel_aarch64_dist"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Specs
        run: |
          echo "cores: $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Liberar disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Volume + swap
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          sudo fallocate -l 24G /mnt/build/swapfile && sudo chmod 600 /mnt/build/swapfile
          sudo mkswap /mnt/build/swapfile >/dev/null && sudo swapon /mnt/build/swapfile
          free -h; df -h / /mnt/build | tail -2

      - name: Dependencias + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (GKI manifest PADRAO, WORKSPACE do AOSP)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          echo "--- WORKSPACE existe (a do AOSP, NAO a da MTK):"; ls -la WORKSPACE 2>/dev/null
          du -sh .; df -h / /mnt/build | tail -2

      - name: Checkout do common na TAG do STOCK (${{ inputs.gki_tag }} = d77c4cd65aed, 6.1.141)
        run: |
          cd "$WS/common"
          echo "HEAD antes: $(git rev-parse --short HEAD)"
          # d77c4cd65aed NAO e ancestral do common-android14-6.1 HEAD -> e a TAG android14-6.1-2025-07_r11
          # (branch KMI-frozen 2025-07, release r11, SUBLEVEL=141). googlesource nao faz fetch de SHA
          # arbitrario, mas TAG e fetchable com --depth=1.
          git fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/${{ inputs.gki_tag }}"
          git checkout -q FETCH_HEAD
          H=$(git rev-parse HEAD)
          echo "HEAD agora: $H"
          [ "$H" = "d77c4cd65aedc9148e9db607aef6901cabfb62e5" ] || { echo "🔴 SHA nao bate (esperado d77c4cd65aed...)"; exit 1; }
          echo "SUBLEVEL:"; grep -E '^SUBLEVEL' Makefile
          echo "arvore limpa?"; git status --porcelain | head
          echo "--- scmversion natural:"; ./scripts/setlocalversion 2>/dev/null || true

      - name: Compilar GKI common PELADO (sem KSU/SUSFS)
        id: build
        env:
          BUILD_NUMBER: "14680598"
          SOURCE_DATE_EPOCH: "1767798273"
        run: |
          set -o pipefail
          cd "$WS"
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          tools/bazel --output_user_root="$BZ" run --config=stamp "${{ inputs.target }}" -- --dist_dir="$PWD/dist" 2>&1 | tail -80
          rc=${PIPESTATUS[0]}
          echo "--- disco:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: O que saiu + Linux version
        if: always()
        run: |
          ls -lh "$WS/dist" 2>/dev/null | grep -iE 'image|symvers' || echo "sem dist/"
          IMG=$(find "$WS/dist" -maxdepth 1 -name 'Image' | head -1)
          [ -n "$IMG" ] && { echo "=== Linux version ==="; strings "$IMG" | grep -m1 'Linux version'; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-gki-clean-pelado
          path: |
            /mnt/build/ws/dist/Image*
            /mnt/build/ws/dist/*.gz
            /mnt/build/ws/dist/*symvers*
          if-no-files-found: warn
          retention-days: 14
