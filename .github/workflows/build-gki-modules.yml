name: build vienna GKI MODULES (connac2 wifi) contra o common (.ack)

# Fase 2 — o WIFI. Descoberta 26/08 (pesquisa profunda): num device Android 14 GKI o boot.img
# de fabrica E a GKI pura (AOSP common); o wifi connac2 vive em MODULOS de vendor, NAO na Image.
# A arvore kernel-mtk (que buildava a Image) miscompila e panica — e e o artefato ERRADO.
# As proprias regras da MTK tem a variante `.ack` (Android Common Kernel / GKI-mixed): builda os
# modulos de connectividade CONTRA `//common-6.1` (base = //common-6.1:kernel_aarch64_debug,
# gki_mixed_build, SEM kmi trim, SEM chave de assinatura). Este workflow reproduz essa topologia:
#   common-6.1 = AOSP common @ d77c4cd65aed (a MESMA que ja boota) ; MODE=ack ;
#   alvo = //kernel_device_modules-6.1:mgk_64_k61_customer_dist.ack
# Sai o conjunto de .ko (conninfra/connfem/connadp/connscp/wmt/wlan_drv_gen4m_6878/mddp...) que
# depois entra no vendor_dlkm por repack. Ref: doc-dono MOTOROLA_EDGE_60_NEO.md §9.14.1.
on:
  workflow_dispatch:
    inputs:
      gki_tag:         { default: "android14-6.1-2025-07_r11" }
      manifest_branch: { default: "common-android14-6.1" }
      mmi_tag:         { default: "MMI-W1UIS36H.39-17-8" }
      mode:            { default: "ack" }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Specs
        run: |
          echo "cores $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Liberar disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Volume + swap
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          sudo fallocate -l 24G /mnt/build/swapfile && sudo chmod 600 /mnt/build/swapfile
          sudo mkswap /mnt/build/swapfile >/dev/null && sudo swapon /mnt/build/swapfile
          free -h; df -h / /mnt/build | tail -2

      - name: Dependencias + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (GKI manifest PADRAO — da o kleaf em build/kernel + common/)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          du -sh .; df -h / /mnt/build | tail -2

      - name: common na TAG do stock + alias common-6.1 (base do .ack)
        run: |
          cd "$WS/common"
          # 🔑 NAO renomear common: o workspace_status do kleaf (--config=stamp) valida o manifesto do
          # `repo`, que tem o projeto em path `common`. Renomear => "Project common does not exist".
          # Fixo a tag do KMI em common/ e crio common-6.1 como SYMLINK (o .ack referencia //common-6.1).
          git fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/${{ inputs.gki_tag }}"
          git checkout -q FETCH_HEAD
          H=$(git rev-parse HEAD)
          [ "$H" = "d77c4cd65aedc9148e9db607aef6901cabfb62e5" ] || { echo "🔴 SHA common nao bate ($H)"; exit 1; }
          cd "$WS"; ln -sfn common common-6.1
          echo "common HEAD=$H  common-6.1 -> $(readlink common-6.1)  $(grep -E '^SUBLEVEL' common/Makefile)"

      - name: Arvores da Motorola na tag ${{ inputs.mmi_tag }}
        run: |
          cd "$WS"; T="${{ inputs.mmi_tag }}"
          dl(){ curl -fsSL "https://codeload.github.com/MotorolaMobilityLLC/$1/tar.gz/refs/tags/$T" | tar -xz; }
          # kernel-6.1 (kernel-mtk): NAO e a base do .ack, mas o workspace/bzl referencia
          # //kernel-6.1:android/abi_gki_aarch64_mtk (symbol_list) — precisa resolver o label.
          dl kernel-mtk                        && mv "kernel-mtk-$T"                        kernel-6.1
          dl kernel-kernel_device_modules-6.1  && mv "kernel-kernel_device_modules-6.1-$T"  kernel_device_modules-6.1
          git clone -q --depth 1 -b "$T" \
            https://github.com/MotorolaMobilityLLC/kernel-build-bazel_mgk_rules build/bazel_mgk_rules
          cp -f build/bazel_mgk_rules/kleaf/bazel.WORKSPACE WORKSPACE
          # repos de connectividade (connac2). 🔑 o WORKSPACE usa `new_local_repository path=
          # "../vendor/mediatek/..."` => vendor tem de ser IRMAO do $WS (em /mnt/build/vendor), NAO dentro.
          VEND=/mnt/build/vendor/mediatek/kernel_modules/connectivity
          mkdir -p "$VEND/wlan/core"
          cd "$VEND"
          dlc(){ curl -fsSL "https://codeload.github.com/MotorolaMobilityLLC/$1/tar.gz/refs/tags/$T" | tar -xz && mv "$1-$T" "$2"; }
          dlc vendor-mediatek-kernel_modules-connectivity-conninfra      conninfra
          dlc vendor-mediatek-kernel_modules-connectivity-connfem        connfem
          dlc vendor-mediatek-kernel_modules-connectivity-common         common
          dlc vendor-mediatek-kernel_modules-connectivity-wlan-adaptor   wlan/adaptor
          dlc vendor-mediatek-kernel_modules-connectivity-wlan-core-gen4m wlan/core/gen4m
          # o vendor REAL fica em /mnt/build/vendor (irmao do ws -> satisfaz @mgk_ko `../vendor`);
          # symlink $WS/vendor -> ele p/ os labels do repo PRINCIPAL (//vendor/...) tambem resolverem.
          ln -sfn /mnt/build/vendor "$WS/vendor"
          cd "$WS"; echo "--- $WS/vendor (symlink) ---"; ls -l vendor; echo "--- alvos //vendor ---"; ls vendor/mediatek/kernel_modules/connectivity
          du -sh /mnt/build/vendor; df -h / /mnt/build | tail -2

      - name: Fix do grupo base — moto_chg_tcmd (símbolo que os charger .ko pedem)
        run: |
          cd "$WS"
          # O grupo base (sem overlay) tem os charger/battery .ko que importam `moto_chg_tcmd_register`,
          # mas o `moto_chg_tcmd.ko` que EXPORTA o símbolo só está nas listas de overlay (que puxam a
          # árvore //motorola/kernel/modules/*, um repo inteiro). Como só quero o connac2, adiciono o
          # moto_chg_tcmd (device_module in-tree, path drivers/power/supply) à lista BASE + ligo o config
          # — resolve o modpost sem puxar a árvore motorola.
          echo 'CONFIG_MOTO_CHG_TCMD_SUPPORT=m' >> kernel_device_modules-6.1/arch/arm64/configs/mgk_64_k61_defconfig
          sed -i '/^mgk_64_k61_device_modules = \[/a\    "drivers/power/supply/moto_chg_tcmd.ko",' \
            kernel_device_modules-6.1/kernel/kleaf/mgk_64_k61.bzl
          echo "--- confer:"; grep -n "moto_chg_tcmd" kernel_device_modules-6.1/kernel/kleaf/mgk_64_k61.bzl | head; \
            tail -2 kernel_device_modules-6.1/arch/arm64/configs/mgk_64_k61_defconfig

      - name: Build MODULOS .ack (connac2 contra o common)
        id: build
        env:
          PROJECT: mgk_64_k61
          MODE: ${{ inputs.mode }}
          OUT_DIR: /mnt/build/out
          BUILD_NUMBER: "14680598"
          SOURCE_DATE_EPOCH: "1767798273"
        run: |
          set -o pipefail
          cd "$WS"
          mkdir -p "$OUT_DIR/dist"
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          # invoco o BAZEL DIRETO (pula o _setup_env/build.config da MTK, frágil fora do manifesto
          # deles). mgk_info lê KERNEL_VERSION do env (workspace common_kernel_package=//kernel-6.1);
          # o alvo .ack faz a regra usar //common-6.1 como base.
          export KERNEL_VERSION=kernel-6.1 DEFCONFIG_OVERLAYS="" \
                 SOURCE_DATE_EPOCH="1767798273" BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN=1
          echo "===== BUILD do wlan_drv_gen4m_6878 .ack (puxa conninfra/connfem/wmt/page_pool + device symvers) ====="
          WLAN='//vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/build/connac2x/6878:wlan_drv_gen4m_6878.mgk_64_k61.6.1.ack'
          set -x
          tools/bazel --output_user_root="$BZ" build \
            --//build/bazel_mgk_rules:kernel_version=6.1 \
            --config=stamp --nokmi_symbol_list_violations_check \
            "$WLAN" 2>&1 | tail -170
          rc=${PIPESTATUS[0]}
          set +x
          echo "===== .ko produzidos ====="
          find "$BZ" bazel-bin /mnt/build -name '*.ko' 2>/dev/null | grep -iE "wlan|conninfra|connfem|connadp|connscp|wmt|mddp|page_pool|fmradio" | sort -u | head -40
          # copia p/ o dist
          mkdir -p "$OUT_DIR/dist"
          find "$BZ" bazel-bin /mnt/build -name '*.ko' 2>/dev/null -exec cp -n {} "$OUT_DIR/dist/" \; 2>/dev/null || true
          echo "--- disco:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: O que saiu (.ko)
        if: always()
        run: |
          echo "=== .ko no dist ==="; find /mnt/build/out -name '*.ko' 2>/dev/null | sort | head -60
          echo "=== procurando o wlan_drv_gen4m_6878 ==="; find /mnt/build -name 'wlan_drv_gen4m*' 2>/dev/null | head

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-gki-modules-ack
          path: |
            /mnt/build/out/dist/**/*.ko
            /mnt/build/out/dist/**
          if-no-files-found: warn
          retention-days: 14
