name: KSU-Next autobuild (detecta release novo -> rebuilda o kernel built-in)

# Lado GITHUB da automacao (25/08/2026). Cron diario: se sair release NOVO do KernelSU-Next
# OFICIAL (rifsxd), bumpa o `ksun_ref` default do build-gki-ksu.yml e dispara o build (artefato
# pronto). NAO flasha (regra do dono: flash so manual, e driver+manager alinhados -> o app manager
# e' acompanhado pelo AndroidSync). Respeita "sempre no mais recente" mantendo o default vivo no repo.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC diario
  workflow_dispatch:

permissions:
  contents: write   # commit do bump

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LATEST=$(gh release view -R KernelSU-Next/KernelSU-Next --json tagName -q .tagName)
          CUR=$(grep -oE 'ksun_ref: \{ default: "[^"]+"' .github/workflows/build-gki-ksu.yml | head -1 | grep -oE '"[^"]+"$' | tr -d '"')
          echo "latest KSU-Next=$LATEST | ref atual no repo=$CUR"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CUR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "sem release novo, nada a fazer."; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # bumpa o default nos DOIS workflows (dispatch e call inputs ficam no mesmo arquivo)
          sed -i "s/ksun_ref: { default: \"[^\"]*\"/ksun_ref: { default: \"$LATEST\"/; s/ksun_ref: { type: string, default: \"[^\"]*\"/ksun_ref: { type: string, default: \"$LATEST\"/" .github/workflows/build-gki-ksu.yml
          git config user.name  "vienna-ci"
          git config user.email "ci@localhost"
          git commit -am "auto: bump KSU-Next built-in $CUR -> $LATEST (release novo detectado)"
          git push
          echo "bump commitado: $CUR -> $LATEST"

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/build-gki-ksu.yml
    with:
      ksun_ref: ${{ needs.detect.outputs.latest }}
