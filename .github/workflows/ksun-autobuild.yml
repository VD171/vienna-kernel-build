name: KSU-Next autobuild (segue o CI/dev HEAD -> rebuilda o kernel built-in)

# Lado GITHUB da automacao (25/08/2026; passou a seguir o CI em 31/08/2026). Cron diario: se o HEAD
# do branch DEFAULT (dev) do KernelSU-Next OFICIAL (rifsxd) mudar, bumpa o `ksun_ref` default do
# build-gki-ksu.yml para esse commit e dispara o build (artefato pronto). Segue o CI (o canal
# @ksunext_ci compila esses mesmos commits, e e' de la que o AndroidUpdate instala o MANAGER) em vez
# da release TAG, que fica dezenas de commits atras. NAO flasha (regra do dono: flash so manual, e
# driver+manager ALINHADOS -> o driver sobe aqui, o manager e' acompanhado pelo AndroidSync).
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC diario
  workflow_dispatch:

permissions:
  contents: write   # commit do bump

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # SEGUE O CI: HEAD do branch default (dev) do KSU-Next OFICIAL — e' o commit que o canal
          # @ksunext_ci compila (o manager que o AndroidUpdate instala) e o que o driver deve casar.
          # Antes seguia a release TAG (gh release view), que fica dezenas de commits atras do CI.
          DEFBR=$(gh api repos/KernelSU-Next/KernelSU-Next -q .default_branch)
          LATEST=$(gh api "repos/KernelSU-Next/KernelSU-Next/commits/$DEFBR" -q .sha)
          CUR=$(grep -oE 'ksun_ref: \{ default: "[^"]+"' .github/workflows/build-gki-ksu.yml | head -1 | grep -oE '"[^"]+"$' | tr -d '"')
          echo "KSU-Next dev($DEFBR) HEAD=$LATEST | ref atual no repo=$CUR"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CUR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "dev sem commit novo, nada a fazer."; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # bumpa o default nos DOIS workflows (dispatch e call inputs ficam no mesmo arquivo).
          # ksun_ref = commit SHA: o setup.sh do KSU-Next faz clone completo + `git checkout <sha>`
          # (SHA funciona onde a tag funcionava), e o raw.githubusercontent resolve o SHA. (31/08/2026)
          sed -i "s/ksun_ref: { default: \"[^\"]*\"/ksun_ref: { default: \"$LATEST\"/; s/ksun_ref: { type: string, default: \"[^\"]*\"/ksun_ref: { type: string, default: \"$LATEST\"/" .github/workflows/build-gki-ksu.yml
          git config user.name  "vienna-ci"
          git config user.email "ci@localhost"
          git commit -am "auto: bump KSU-Next built-in $CUR -> $LATEST (dev HEAD / segue o CI)"
          git push
          echo "bump commitado: $CUR -> $LATEST"

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/build-gki-ksu.yml
    with:
      ksun_ref: ${{ needs.detect.outputs.latest }}
