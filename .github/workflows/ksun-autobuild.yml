name: KSU-Next autobuild (segue o CI/dev HEAD -> rebuilda o kernel built-in)

# Lado GITHUB da automacao (25/08/2026; segue o CI desde 31/08). FIX 02/09/2026: parou de commitar/
# pushar o bump DENTRO do build-gki-ksu.yml -- o GITHUB_TOKEN das Actions nao tem permissao `workflows`
# e o push era REJEITADO ("refusing to allow a GitHub App to create or update workflow ... without
# workflows permission"), travando o autobuild desde 01/09. Agora o dev HEAD vai DIRETO pro build via
# output do job (needs.detect.outputs.latest), e o "ja buildei este SHA?" fica no actions/cache -- SEM
# push nenhum. Cron diario: se o HEAD do branch default (dev) do KSU-Next OFICIAL mudou e ainda nao foi
# buildado, dispara o build. Segue o CI (@ksunext_ci compila esses commits; e' de la que o AndroidUpdate
# instala o MANAGER) em vez da release TAG. NAO flasha (flash so manual; driver sobe aqui, manager alinhado
# pelo AndroidSync).
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC diario
  workflow_dispatch:

permissions:
  contents: write   # o job de build publica a release

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # SEGUE O CI: HEAD do branch default (dev) do KSU-Next OFICIAL — o commit que o @ksunext_ci
          # compila (o manager que o AndroidUpdate instala) e o que o driver built-in deve casar.
          DEFBR=$(gh api repos/KernelSU-Next/KernelSU-Next -q .default_branch)
          LATEST=$(gh api "repos/KernelSU-Next/KernelSU-Next/commits/$DEFBR" -q .sha)
          [ -n "$LATEST" ] || { echo "sem HEAD do dev"; exit 1; }
          echo "KSU-Next dev($DEFBR) HEAD=$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
      # "ja buildei este SHA?" -> cache (sem push). HIT = ja buildado (skip); MISS = build.
      - id: seen
        uses: actions/cache/restore@v4
        with:
          path: .ksun-built
          key: ksun-built-${{ steps.head.outputs.latest }}
          lookup-only: true
      - id: check
        run: |
          if [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SHA ${{ steps.head.outputs.latest }} ja buildado (cache hit) — nada a fazer."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "dev HEAD novo — vai buildar."
          fi

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/build-gki-ksu.yml
    with:
      ksun_ref: ${{ needs.detect.outputs.latest }}

  # marca o SHA como buildado SO' apos o build OK (build que falha retenta no proximo cron)
  mark:
    needs: [detect, build]
    if: needs.detect.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s' "${{ needs.detect.outputs.latest }}" > .ksun-built
      - uses: actions/cache/save@v4
        with:
          path: .ksun-built
          key: ksun-built-${{ needs.detect.outputs.latest }}
