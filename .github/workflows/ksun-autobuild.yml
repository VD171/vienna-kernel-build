name: KSU-Next autobuild (follows the CI/dev HEAD -> rebuilds the built-in kernel)

# GITHUB side of the automation (2026-08-25; follows the CI since 2026-08-31). FIX 2026-09-02: it stopped
# committing/pushing the bump INSIDE build-gki-ksu.yml -- the Actions GITHUB_TOKEN has no `workflows`
# permission and the push was REJECTED ("refusing to allow a GitHub App to create or update workflow ...
# without workflows permission"), which stalled the autobuild since 2026-09-01. Now the dev HEAD goes
# STRAIGHT to the build through the job output (needs.detect.outputs.latest), and "did I already build this
# SHA?" lives in actions/cache -- NO push at all. Daily cron: if the HEAD of the default branch (dev) of the
# OFFICIAL KSU-Next changed and has not been built yet, trigger the build. It follows the CI (@ksunext_ci
# compiles those commits; that is where AndroidUpdate installs the MANAGER from) instead of the release TAG.
# It does NOT flash (flashing is manual only; the driver is bumped here, the manager is aligned by AndroidSync).
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write   # the build job publishes the release

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # FOLLOWS THE CI: HEAD of the default branch (dev) of the OFFICIAL KSU-Next - the commit that
          # @ksunext_ci compiles (the manager AndroidUpdate installs) and the one the built-in driver must match.
          DEFBR=$(gh api repos/KernelSU-Next/KernelSU-Next -q .default_branch)
          LATEST=$(gh api "repos/KernelSU-Next/KernelSU-Next/commits/$DEFBR" -q .sha)
          [ -n "$LATEST" ] || { echo "no dev HEAD"; exit 1; }
          echo "KSU-Next dev($DEFBR) HEAD=$LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
      # "did I already build this SHA?" -> cache (no push). HIT = already built (skip); MISS = build.
      - id: seen
        uses: actions/cache/restore@v4
        with:
          path: .ksun-built
          key: ksun-built-${{ steps.head.outputs.latest }}
          lookup-only: true
      - id: check
        run: |
          if [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SHA ${{ steps.head.outputs.latest }} already built (cache hit) - nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new dev HEAD - will build."
          fi

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/build-gki-ksu.yml
    with:
      ksun_ref: ${{ needs.detect.outputs.latest }}

  # mark the SHA as built ONLY after a successful build (a failed build retries on the next cron)
  mark:
    needs: [detect, build]
    if: needs.detect.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s' "${{ needs.detect.outputs.latest }}" > .ksun-built
      - uses: actions/cache/save@v4
        with:
          path: .ksun-built
          key: ksun-built-${{ needs.detect.outputs.latest }}
