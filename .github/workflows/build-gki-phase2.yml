name: build vienna GKI FASE 2 (common puro + KSU-Next + SUSFS)

# Fase 2 no caminho CERTO: GKI `common` PURO @d77c4cd65aed (tag android14-6.1-2025-07_r11, SUBLEVEL=141),
# WORKSPACE PADRAO do AOSP (a da MTK era a causa raiz do panic, provado: common pelado BOOTA), + KSU-Next
# + SUSFS. Vermagic sai natural do git (checkout do commit) mantido limpo com `git update-index
# --assume-unchanged` nos arquivos que KSU/SUSFS modificam (senao o git-describe viraria -dirty).
on:
  workflow_dispatch:
    inputs:
      gki_tag:
        default: "android14-6.1-2025-07_r11"
      manifest_branch:
        default: "common-android14-6.1"
      target:
        default: "//common:kernel_aarch64_dist"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Specs
        run: |
          echo "cores $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Liberar disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Volume + swap
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          sudo fallocate -l 24G /mnt/build/swapfile && sudo chmod 600 /mnt/build/swapfile
          sudo mkswap /mnt/build/swapfile >/dev/null && sudo swapon /mnt/build/swapfile
          free -h; df -h / /mnt/build | tail -2

      - name: Dependencias + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (GKI manifest PADRAO)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          du -sh .; df -h / /mnt/build | tail -2

      - name: Checkout common na TAG do stock
        run: |
          cd "$WS/common"
          git fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/${{ inputs.gki_tag }}"
          git checkout -q FETCH_HEAD
          H=$(git rev-parse HEAD)
          [ "$H" = "d77c4cd65aedc9148e9db607aef6901cabfb62e5" ] || { echo "🔴 SHA nao bate"; exit 1; }
          echo "HEAD=$H  SUBLEVEL=$(grep -E '^SUBLEVEL' Makefile)"

      - name: Integrar KSU-Next + SUSFS no common (par datado, pinado)
        run: |
          cd "$WS"
          SUSFS_SHA=d961d86cc30260fcc26d81105bddeb5f51c67ce5   # pershoot/susfs4ksu gki-android14-6.1-lts-dev_122425
          KSUN_SHA=bfc9d1805b653b44151bebfea79592a8da4c3017    # pershoot/KernelSU-Next next-susfs (susfs embutido)
          git clone -q https://gitlab.com/pershoot/susfs4ksu
          ( cd susfs4ksu && git checkout -q "$SUSFS_SHA" )
          # (1) KSU-Next next-susfs no common (setup.sh integra o driver)
          ( cd common && curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/${KSUN_SHA}/kernel/setup.sh" | bash -s next-susfs )
          test -d common/KernelSU-Next || ls -d common/drivers/kernelsu 2>/dev/null || { echo "🔴 setup.sh falhou"; exit 1; }
          # (2) arquivos SUSFS
          cp -v susfs4ksu/kernel_patches/fs/susfs.c                common/fs/
          cp -v susfs4ksu/kernel_patches/include/linux/susfs.h     common/include/linux/
          cp -v susfs4ksu/kernel_patches/include/linux/susfs_def.h common/include/linux/
          # (3) patch SUSFS no kernel (50_). Em common PURO deve aplicar LIMPO (o reject do base.c era
          #     artefato do fork MTK). Se rejeitar, aborta e mostra.
          ( cd common && patch -p1 --no-backup-if-mismatch --force < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ) || true
          R=$(cd common && find . -name '*.rej' | sort)
          if [ -z "$R" ]; then echo "✅ 50_ limpo";
          elif [ "$R" = "./fs/proc/base.c.rej" ]; then
            echo "🟡 reject conhecido (fs/proc/base.c include) — inserindo manualmente:"
            sed -i '0,/#include "internal.h"/s//#if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif\n\n#include "internal.h"/' common/fs/proc/base.c
            rm common/fs/proc/base.c.rej
            grep -q 'linux/susfs_def.h' common/fs/proc/base.c && echo "✅ include inserido" || { echo "🔴 insercao falhou"; exit 1; }
          else
            echo "🔴 rejects 50_ INESPERADOS:"; (cd common && find . -name '*.rej' -exec sh -c 'echo "== $1"; sed -n 1,25p "$1"' _ {} \;); exit 1
          fi
          # (4) manual hooks (60_)
          ( cd common && patch -p1 --no-backup-if-mismatch < ../susfs4ksu/kernel_patches/60_scope-minimized_manual_hooks.patch ) || true
          R6=$(cd common && find . -name '*.rej')
          [ -z "$R6" ] || { echo "🔴 60_ rejeitou:"; (cd common && find . -name '*.rej' -exec sh -c 'echo "== $1"; sed -n 1,25p "$1"' _ {} \;); exit 1; }
          echo "✅ 60_ limpo"
          # (5) 🔑 manter o git-describe LIMPO (senao KSU/SUSFS deixam a arvore -dirty e o vermagic
          #     viraria ...-dirty...). assume-unchanged nos tracked modificados; untracked o -uno ignora.
          ( cd common && git update-index --assume-unchanged $(git ls-files -m) 2>/dev/null || true )
          echo "--- scmversion (deve ser -gd77c4cd65aed, SEM -dirty):"; ( cd common && ./scripts/setlocalversion 2>/dev/null || true )

      - name: Compilar (common + KSU-Next + SUSFS)
        id: build
        env:
          BUILD_NUMBER: "14680598"
          SOURCE_DATE_EPOCH: "1767798273"
        run: |
          set -o pipefail
          cd "$WS"
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          tools/bazel --output_user_root="$BZ" run --config=stamp "${{ inputs.target }}" -- --dist_dir="$PWD/dist" 2>&1 | tail -100
          rc=${PIPESTATUS[0]}
          echo "===== CONFIG_KSU no .config ====="
          find /mnt/build -name '.config' 2>/dev/null | xargs -r grep -l 'CONFIG_KSU=' 2>/dev/null | head -1 \
            | xargs -r grep -E 'CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_SUS_PATH=' 2>/dev/null || echo "(KSU nao no .config!)"
          echo "--- disco:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: O que saiu + Linux version + marcadores
        if: always()
        run: |
          ls -lh "$WS/dist" 2>/dev/null | grep -iE 'image|symvers' || echo "sem dist/"
          IMG=$(find "$WS/dist" -maxdepth 1 -name 'Image' | head -1)
          if [ -n "$IMG" ]; then
            echo "=== Linux version (byte a byte?) ==="; strings "$IMG" | grep -m1 'Linux version'
            echo "=== marcadores KSU/SUSFS ==="; strings "$IMG" | grep -iE 'kernelsu|susfs' | sort -u | head -12
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-gki-phase2
          path: |
            /mnt/build/ws/dist/Image*
            /mnt/build/ws/dist/*.gz
            /mnt/build/ws/dist/*symvers*
          if-no-files-found: warn
          retention-days: 14
