name: build vienna GKI + KSU-Next OFICIAL built-in (SEM susfs)

# Fase 2, decisao do dono "sem susfs" (25/08/2026): GKI `common` PURO @d77c4cd65aed
# (tag android14-6.1-2025-07_r11, SUBLEVEL=141), WORKSPACE PADRAO do AOSP (a da MTK era a
# causa raiz do panic; provado: common pelado BOOTA) + KernelSU-Next OFICIAL v3.3.0 built-in.
# Sem susfs => sem cola, sem fork, sem 50_/60_, sem base.c: 100% dev oficial, manager alinhado.
# Vermagic sai natural do git (checkout do commit), mantido limpo com `git update-index
# --assume-unchanged` nos arquivos que o setup do KSU modifica (senao o git-describe viraria -dirty).
on:
  workflow_dispatch:
    inputs:
      gki_tag: { default: "android14-6.1-2025-07_r11" }
      manifest_branch: { default: "common-android14-6.1" }
      target: { default: "//common:kernel_aarch64_dist" }
      ksun_ref: { default: "legacy" }
  workflow_call:
    inputs:
      gki_tag: { type: string, default: "android14-6.1-2025-07_r11" }
      manifest_branch: { type: string, default: "common-android14-6.1" }
      target: { type: string, default: "//common:kernel_aarch64_dist" }
      ksun_ref: { type: string, default: "legacy" }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Specs
        run: |
          echo "cores $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Liberar disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Volume + swap
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          sudo fallocate -l 24G /mnt/build/swapfile && sudo chmod 600 /mnt/build/swapfile
          sudo mkswap /mnt/build/swapfile >/dev/null && sudo swapon /mnt/build/swapfile
          free -h; df -h / /mnt/build | tail -2

      - name: Dependencias + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (GKI manifest PADRAO)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          du -sh .; df -h / /mnt/build | tail -2

      - name: Checkout common na TAG do stock
        run: |
          cd "$WS/common"
          git fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/${{ inputs.gki_tag }}"
          git checkout -q FETCH_HEAD
          H=$(git rev-parse HEAD)
          [ "$H" = "d77c4cd65aedc9148e9db607aef6901cabfb62e5" ] || { echo "🔴 SHA nao bate"; exit 1; }
          echo "HEAD=$H  SUBLEVEL=$(grep -E '^SUBLEVEL' Makefile)"

      - name: Remover GKI protected exports (fix wifi/bt em kernel custom)
        run: |
          # CAUSA RAIZ (26/08) da fase 2 sem wifi: no kernel custom a chave de assinatura e NOSSA,
          # entao os modulos GKI stock (rfkill/cfg80211/mac80211, assinados pelo Google) sao "unsigned"
          # p/ nos e NAO podem resolver os SIMBOLOS PROTEGIDOS -> a cadeia rfkill->cfg80211->mac80211->
          # wlan_drv nao sobe -> sem wifi. Fix padrao da comunidade GKI: remover a lista de protected
          # exports do common. E invisivel a um diff de defconfig: e alvo do BUILD.bazel, nao do Kconfig.
          cd "$WS/common"
          FILES=$(ls android/abi_gki_protected_exports_* 2>/dev/null || true)
          sed -i '/protected_exports_list/d' BUILD.bazel
          rm -f android/abi_gki_protected_exports_*
          git update-index --assume-unchanged BUILD.bazel $FILES 2>/dev/null || true
          echo "--- protected_exports_list no BUILD.bazel (deve sumir):"
          grep -n protected_exports_list BUILD.bazel && { echo "ainda tem"; exit 1; } || echo "  (removido OK)"
          ls android/abi_gki_protected_exports_* 2>/dev/null && { echo "abi ainda existe"; exit 1; } || echo "--- abi_gki_protected_exports_* removidos OK"

      - name: Integrar KSU-Next OFICIAL (built-in, sem susfs)
        run: |
          cd "$WS"
          KSUN_REF="${{ inputs.ksun_ref }}"
          # setup.sh OFICIAL do rifsxd (KernelSU-Next/KernelSU-Next). $KSUN_REF = tag a dar checkout.
          ( cd common && curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUN_REF}/kernel/setup.sh" | bash -s "$KSUN_REF" )
          # 🔧 branch com manual hooks = LEGACY (dev/stable sao kprobes-only). Forcar checkout legacy.
          # (dev/stable NAO tem KSU_MANUAL_HOOK; so o branch `legacy` tem). Full clone tem origin/*.
          ( cd common/KernelSU-Next && git remote set-branches origin '*' 2>/dev/null; git fetch -q origin legacy && git checkout -B legacy origin/legacy && echo "KSU em legacy: $(git rev-parse --short HEAD)" ) || { echo "🔴 checkout next falhou"; exit 1; }
          grep -q "config KSU_MANUAL_HOOK" common/KernelSU-Next/kernel/Kconfig || { echo "🔴 legacy sem KSU_MANUAL_HOOK no Kconfig"; exit 1; }
          # o setup cria drivers/kernelsu (symlink) + KernelSU-Next/ e edita Kconfig/Makefile de drivers/
          ls -d common/KernelSU-Next 2>/dev/null || ls -l common/drivers/kernelsu 2>/dev/null || { echo "🔴 setup.sh falhou"; exit 1; }
          echo "--- versao KSU-Next integrada:"; ( cd common/KernelSU-Next 2>/dev/null && git describe --tags 2>/dev/null || cat kernel/Makefile 2>/dev/null | grep -m1 -i version || true )
          # === BAKER DA VERSAO (fix v0.0.1): o Kbuild calcula KSU_VERSION=30000+git-rev-count do
          #     proprio git, mas o sandbox do Bazel NAO tem .git -> fallback (1 / v0.0.1) -> su quebra
          #     e o manager fica "legacy". Computamos aqui (o clone TEM git) e injetamos como literal. ===
          ( cd common/KernelSU-Next && ( [ -f .git/shallow ] && git fetch --unshallow -q 2>/dev/null || git fetch -q --tags 2>/dev/null || true ) )
          KV=$(cd common/KernelSU-Next && git rev-list --count HEAD 2>/dev/null)
          KT=$(cd common/KernelSU-Next && git describe --tags --abbrev=0 2>/dev/null || echo "$KSUN_REF")
          [ -n "$KV" ] && [ "$KV" -gt 1 ] || { echo "🔴 KSU_GIT_VERSION invalido ($KV)"; exit 1; }
          KB=common/KernelSU-Next/kernel/Kbuild
          sed -i "s|^# Check if this is a git repository|KSU_GIT_VERSION := ${KV}\nKSU_GIT_TAG := ${KT}\nKSU_GIT_VERSION_VALID := 1\n# Check if this is a git repository|" "$KB"
          echo "--- BAKED KSU: KSU_GIT_VERSION=${KV}  KSU_VERSION=$((30000+KV))  tag=${KT}"
          grep -nE "KSU_GIT_VERSION :=|KSU_GIT_TAG :=|KSU_GIT_VERSION_VALID :=" "$KB" | head
          # manter o git-describe LIMPO (senao o KSU deixa a arvore -dirty e o vermagic viraria ...-dirty).
          ( cd common && git update-index --assume-unchanged $(git ls-files -m) 2>/dev/null || true )
          echo "--- scmversion (deve ser -gd77c4cd65aed, SEM -dirty):"; ( cd common && ./scripts/setlocalversion 2>/dev/null || true )

      - name: Manual hooks (non-kprobe, esconde o sucompat SCA)
        run: |
          # Fase 2 stealth: o "sucompat SCA" detecta os hooks por KPROBE. O KSU-Next `legacy` tem
          # CONFIG_KSU_MANUAL_HOOK (hooks inline no source). Assinaturas casadas com o legacy
          # (open/exec/read/stat/reboot); reboot.c e a SENTINELA que o Kbuild do legacy exige.
          cd "$WS/common"
          echo '' | base64 -d > /tmp/mh.py
          python3 /tmp/mh.py
          # Ligar o manual hook pelo DEFAULT do Kconfig do KSU (nao no gki_defconfig: quebra savedefconfig).
          sed -i 's/default y if !KPROBES/default y/' KernelSU-Next/kernel/Kconfig
          # COMPAT 6.1: este android common usa a assinatura LSM PLANA (sem user_namespace/mnt_idmap)
          # em inode_permission/inode_rename (confirmado no lsm_hook_defs.h). O legacy escolhe userns
          # p/ 5.12<=ver<6.3 -> mismatch. Forcar o ramo #else (plano) nesses 2 (os unicos guards 5.12).
          sed -i 's/LINUX_VERSION_CODE >= KERNEL_VERSION(5, 12, 0)/LINUX_VERSION_CODE >= KERNEL_VERSION(9, 9, 9)/g' KernelSU-Next/kernel/hook/lsm_hooks.c
          # o codigo do legacy dispara varios -Werror (implicit-fallthrough etc.) no build estrito do
          # GKI. Relaxa os warnings SO do modulo KSU (nao toca a logica nem o resto do kernel).
          echo 'ccflags-y += -Wno-error' >> KernelSU-Next/kernel/Kbuild
          echo "--- ccflags KSU:"; tail -2 KernelSU-Next/kernel/Kbuild
          echo "--- lsm_hooks guards apos compat:"; grep -c "KERNEL_VERSION(9, 9, 9)" KernelSU-Next/kernel/hook/lsm_hooks.c
          echo "--- hooks por arquivo:"; grep -c ksu_handle_ fs/open.c fs/exec.c fs/read_write.c fs/stat.c kernel/reboot.c
          echo "--- Kbuild sentinel (ksu_handle_sys_reboot em reboot.c):"; grep -c ksu_handle_sys_reboot kernel/reboot.c
          # vermagic LIMPO: assume-unchanged nos 5 arquivos do common que editei
          git update-index --assume-unchanged fs/open.c fs/exec.c fs/read_write.c fs/stat.c kernel/reboot.c 2>/dev/null || true
          echo "--- scmversion:"; ./scripts/setlocalversion 2>/dev/null || true

      - name: Compilar (common + KSU-Next oficial)
        id: build
        env:
          BUILD_NUMBER: "14680598"
          SOURCE_DATE_EPOCH: "1767798273"
        run: |
          set -o pipefail
          cd "$WS"
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          tools/bazel --output_user_root="$BZ" run --config=stamp --notrim "${{ inputs.target }}" -- --dist_dir="$PWD/dist" 2>&1 | tail -100
          rc=${PIPESTATUS[0]}
          echo "===== CONFIG_KSU no .config ====="
          find /mnt/build -name '.config' 2>/dev/null | xargs -r grep -l 'CONFIG_KSU=' 2>/dev/null | head -1 \
            | xargs -r grep -E 'CONFIG_KSU=|CONFIG_KSU_' 2>/dev/null || echo "(KSU nao no .config!)"
          echo "--- disco:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: O que saiu + Linux version + marcadores
        if: always()
        run: |
          ls -lh "$WS/dist" 2>/dev/null | grep -iE 'image|symvers' || echo "sem dist/"
          IMG=$(find "$WS/dist" -maxdepth 1 -name 'Image' | head -1)
          if [ -n "$IMG" ]; then
            echo "=== Linux version (byte a byte?) ==="; strings "$IMG" | grep -m1 'Linux version'
            echo "=== marcadores KSU ==="; strings "$IMG" | grep -iE 'kernelsu|susfs' | sort -u | head -12
          fi

      - name: Empacotar a SOURCE correspondente (GPL) - a arvore exata que compilou
        if: success()
        run: |
          # GPL-2.0: quem distribui o binario tem de oferecer a fonte correspondente.
          # Aqui sai a arvore `common/` EXATA que produziu este Image (GKI common na tag do
          # stock + KernelSU-Next integrado + o baker da versao), sem .git e sem saida do bazel.
          # Vira asset da release junto do kernel. Nao e um espelho do AOSP: e o que compilou.
          cd "$WS"
          tar --exclude='.git' --exclude='bazel-*' --exclude='out' \
              -I 'zstd -T0 -12' -cf "$WS/dist/vienna-kernel-source-corresponding.tar.zst" common
          ls -lh "$WS/dist/vienna-kernel-source-corresponding.tar.zst"
          sha256sum "$WS/dist/vienna-kernel-source-corresponding.tar.zst"
          echo "--- revisoes que compoem esta arvore (a receita, para reproduzir):"
          echo "  GKI common : ${{ inputs.gki_tag }} (android.googlesource.com/kernel/common)"
          echo "  KernelSU-Next: ${{ inputs.ksun_ref }} (github.com/KernelSU-Next/KernelSU-Next)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-gki-ksu-nosusfs
          path: |
            /mnt/build/ws/dist/Image*
            /mnt/build/ws/dist/*.gz
            /mnt/build/ws/dist/*symvers*
            /mnt/build/ws/dist/vienna-kernel-source-corresponding.tar.zst
          if-no-files-found: warn
          retention-days: 14
