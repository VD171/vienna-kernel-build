name: build vienna GKI + KSU-Next OFICIAL built-in (SEM susfs)

# Fase 2, decisao do dono "sem susfs" (25/08/2026): GKI `common` PURO @d77c4cd65aed
# (tag android14-6.1-2025-07_r11, SUBLEVEL=141), WORKSPACE PADRAO do AOSP (a da MTK era a
# causa raiz do panic; provado: common pelado BOOTA) + KernelSU-Next OFICIAL v3.3.0 built-in.
# Sem susfs => sem cola, sem fork, sem 50_/60_, sem base.c: 100% dev oficial, manager alinhado.
# Vermagic sai natural do git (checkout do commit), mantido limpo com `git update-index
# --assume-unchanged` nos arquivos que o setup do KSU modifica (senao o git-describe viraria -dirty).
on:
  workflow_dispatch:
    inputs:
      gki_tag: { default: "android14-6.1-2025-07_r11" }
      manifest_branch: { default: "common-android14-6.1" }
      target: { default: "//common:kernel_aarch64_dist" }
      ksun_ref: { default: "v3.3.0" }
  workflow_call:
    inputs:
      gki_tag: { type: string, default: "android14-6.1-2025-07_r11" }
      manifest_branch: { type: string, default: "common-android14-6.1" }
      target: { type: string, default: "//common:kernel_aarch64_dist" }
      ksun_ref: { type: string, default: "v3.3.0" }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Specs
        run: |
          echo "cores $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Liberar disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Volume + swap
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          sudo fallocate -l 24G /mnt/build/swapfile && sudo chmod 600 /mnt/build/swapfile
          sudo mkswap /mnt/build/swapfile >/dev/null && sudo swapon /mnt/build/swapfile
          free -h; df -h / /mnt/build | tail -2

      - name: Dependencias + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (GKI manifest PADRAO)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          du -sh .; df -h / /mnt/build | tail -2

      - name: Checkout common na TAG do stock
        run: |
          cd "$WS/common"
          git fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/${{ inputs.gki_tag }}"
          git checkout -q FETCH_HEAD
          H=$(git rev-parse HEAD)
          [ "$H" = "d77c4cd65aedc9148e9db607aef6901cabfb62e5" ] || { echo "🔴 SHA nao bate"; exit 1; }
          echo "HEAD=$H  SUBLEVEL=$(grep -E '^SUBLEVEL' Makefile)"

      - name: Integrar KSU-Next OFICIAL (built-in, sem susfs)
        run: |
          cd "$WS"
          KSUN_REF="${{ inputs.ksun_ref }}"
          # setup.sh OFICIAL do rifsxd (KernelSU-Next/KernelSU-Next). $KSUN_REF = tag a dar checkout.
          ( cd common && curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUN_REF}/kernel/setup.sh" | bash -s "$KSUN_REF" )
          # o setup cria drivers/kernelsu (symlink) + KernelSU-Next/ e edita Kconfig/Makefile de drivers/
          ls -d common/KernelSU-Next 2>/dev/null || ls -l common/drivers/kernelsu 2>/dev/null || { echo "🔴 setup.sh falhou"; exit 1; }
          echo "--- versao KSU-Next integrada:"; ( cd common/KernelSU-Next 2>/dev/null && git describe --tags 2>/dev/null || cat kernel/Makefile 2>/dev/null | grep -m1 -i version || true )
          # manter o git-describe LIMPO (senao o KSU deixa a arvore -dirty e o vermagic viraria ...-dirty).
          ( cd common && git update-index --assume-unchanged $(git ls-files -m) 2>/dev/null || true )
          echo "--- scmversion (deve ser -gd77c4cd65aed, SEM -dirty):"; ( cd common && ./scripts/setlocalversion 2>/dev/null || true )

      - name: Compilar (common + KSU-Next oficial)
        id: build
        env:
          BUILD_NUMBER: "14680598"
          SOURCE_DATE_EPOCH: "1767798273"
        run: |
          set -o pipefail
          cd "$WS"
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          tools/bazel --output_user_root="$BZ" run --config=stamp "${{ inputs.target }}" -- --dist_dir="$PWD/dist" 2>&1 | tail -100
          rc=${PIPESTATUS[0]}
          echo "===== CONFIG_KSU no .config ====="
          find /mnt/build -name '.config' 2>/dev/null | xargs -r grep -l 'CONFIG_KSU=' 2>/dev/null | head -1 \
            | xargs -r grep -E 'CONFIG_KSU=|CONFIG_KSU_' 2>/dev/null || echo "(KSU nao no .config!)"
          echo "--- disco:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: O que saiu + Linux version + marcadores
        if: always()
        run: |
          ls -lh "$WS/dist" 2>/dev/null | grep -iE 'image|symvers' || echo "sem dist/"
          IMG=$(find "$WS/dist" -maxdepth 1 -name 'Image' | head -1)
          if [ -n "$IMG" ]; then
            echo "=== Linux version (byte a byte?) ==="; strings "$IMG" | grep -m1 'Linux version'
            echo "=== marcadores KSU ==="; strings "$IMG" | grep -iE 'kernelsu|susfs' | sort -u | head -12
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-gki-ksu-nosusfs
          path: |
            /mnt/build/ws/dist/Image*
            /mnt/build/ws/dist/*.gz
            /mnt/build/ws/dist/*symvers*
          if-no-files-found: warn
          retention-days: 14
