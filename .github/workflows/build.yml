name: build vienna kernel

# Objetivo: responder UMA pergunta — o alvo GKI compila sem o `vendor/mediatek`
# (árvore proprietária da MediaTek, que ninguém publica)?
on:
  workflow_dispatch:
    inputs:
      mmi_tag:
        description: "Tag MMI da build Motorola"
        default: "MMI-W1UIS36H.39-17-8"
      manifest_branch:
        description: "Branch do manifesto do kernel AOSP"
        default: "common-android14-6.1"
      target:
        description: "Alvo Bazel"
        default: "//kernel-6.1:kernel_aarch64_abi_dist"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # o teto do job é 360
    steps:
      - name: Specs do runner (medir, não supor)
        run: |
          echo "cores : $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Liberar disco
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          # 🪤 MEDIDO: confiar no cwd NÃO basta. No run 32609985091 o volume ficou com 24 KB
          #    usados e a raiz foi a 100% (329 MB livres) — o build passou por sorte. A cura é
          #    montar num caminho EXPLÍCITO e usá-lo em TODOS os passos, nunca o cwd implícito.
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - run: df -h / | tail -1

      - name: Preparar o volume
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          df -h / /mnt/build | tail -2

      - name: Dependências + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (18 projetos, revisões PINADAS pelo manifesto)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest \
                    -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          echo "--- default revision do manifesto:"; grep -E "<default" .repo/manifests/default.xml
          du -sh . ; df -h / /mnt/build | tail -2

      - name: Árvores da Motorola na tag ${{ inputs.mmi_tag }}
        run: |
          cd "$WS"; T="${{ inputs.mmi_tag }}"
          dl(){ curl -fsSL "https://codeload.github.com/MotorolaMobilityLLC/$1/tar.gz/refs/tags/$T" | tar -xz; }
          dl kernel-mtk                        && mv "kernel-mtk-$T"                        kernel-6.1
          dl kernel-kernel_device_modules-6.1  && mv "kernel-kernel_device_modules-6.1-$T"  kernel_device_modules-6.1
          git clone -q --depth 1 -b "$T" \
            https://github.com/MotorolaMobilityLLC/kernel-build-bazel_mgk_rules build/bazel_mgk_rules
          # o WORKSPACE do MTK substitui o do AOSP (define @mgk_info, mgk_internal, mgk_ko)
          cp -f build/bazel_mgk_rules/kleaf/bazel.WORKSPACE WORKSPACE
          # (sem git init: a scmversion vem do .scmversion via setlocalversion, que nao precisa de git)
          du -sh .; df -h / /mnt/build | tail -2

      - name: Delta do vienna (overlays)
        run: |
          cd "$WS/kernel_device_modules-6.1"
          mkdir -p kernel/configs
          for c in moto-mgk_64_k61 moto-mgk_64_k61-vienna moto-mgk_64_k61-df; do
            cp -v "arch/arm64/configs/ext_config/$c.config" kernel/configs/
          done
          test -f arch/arm64/configs/mgk_64_k61_defconfig && echo "defconfig OK"
          # 🎯 O PATCH que mata o dup SEM mexer no AUTO (builds 9-11 provaram que desligar AUTO quebra o
          #    GKI: CONFIG_MODULE_SCMVERSION depende de LOCALVERSION_AUTO -> "savedefconfig does not match").
          #    Com AUTO=y (obrigatorio) o scm_version() do setlocalversion le o .scmversion em DOIS lugares:
          #    o workspace_status (env do CLIENTE do bazel) e o Kbuild (env HERMETICO do Kleaf). Basta
          #    gatilhar o read numa env var que SO o cliente ve (VD_WS_SCM): workspace_status le (gera o
          #    -gd77c4cd65aed), Kbuild nao le (sem dup). O env hermetico do Kleaf nao passa VD_WS_SCM (foi
          #    por isso que BUILD_NUMBER precisou do stamp). Nao toca em config -> nao mexe no ABI check.
          sed -i 's/if test -e .scmversion; then/if test -n "$VD_WS_SCM" \&\& test -e .scmversion; then/' \
            "$WS/kernel-6.1/scripts/setlocalversion"
          grep -n 'VD_WS_SCM' "$WS/kernel-6.1/scripts/setlocalversion" || { echo "PATCH FALHOU"; exit 1; }

      - name: O TESTE — o alvo GKI compila com a Linux version EXATA?
        id: build
        env:
          BAZEL_DO_NOT_DETECT_CPP_TOOLCHAIN: 1
          KERNEL_VERSION: kernel-6.1
          DEFCONFIG_OVERLAYS: "moto-mgk_64_k61.config moto-mgk_64_k61-vienna.config moto-mgk_64_k61-df.config"
          # ↓ o workspace_status_stamp.py roda no ENV DO CLIENTE do bazel (bazel.py copia os.environ,
          #   l.82/614) e le estas direto (l.99-100 e l.357):
          BUILD_NUMBER: "14680598"          # → sufixo -ab14680598
          SOURCE_DATE_EPOCH: "1767798273"   # → Wed Jan  7 15:04:33 UTC 2026
          VD_WS_SCM: "1"                     # → so o workspace_status (env do cliente) le o .scmversion;
                                             #   o Kbuild (env hermetico) nao ve -> nao duplica o hash
        run: |
          set -o pipefail   # sem isto o `| tail` mascara falha do bazel (build 6 deu "success" FALSO)
          cd "$WS"
          mkdir -p ../vendor/mediatek/kernel_modules   # stub: só para o WORKSPACE carregar
          # Linux version EXATA (doc §9.7). Alvo: 6.1.141-android14-11-gd77c4cd65aed-ab14680598
          # / Wed Jan  7 15:04:33 UTC 2026. Receita da branch main-kernel-build-2023 (a que o repo sync
          # traz), lida no fonte kleaf DESTA branch (bazel.py + workspace_status_stamp.py + stamp.bzl):
          #  1. .scmversion: o scripts/setlocalversion le este arquivo verbatim -> -gd77c4cd65aed.
          #  2. --nokleaf_localversion: o DEFAULT (--kleaf_localversion) usa git describe e IGNORA o
          #     .scmversion (por isso builds 4-5 sairam com scmversion VAZIO). So --nokleaf_localversion
          #     faz o stamp chamar setlocalversion -> le o .scmversion (stamp.py l.313-314).
          #  3. --config=stamp: sem ele stamp.bzl (l.57-62/164-180) hardcoda -maybe-dirty + epoch 0.
          #  ⚠️ Esta branch NAO tem workspace_status.json NEM --extra_git_project (builds 2-6 usaram
          #     mecanismos do kleaf `main`, que nao existem aqui — dai o "Unrecognized option" do build 6).
          #  4. .source_date_epoch_dir -> kernel-6.1: O LEVER FINAL (build 7 mostrou o WARNING "Can't
          #     determine STABLE_SCMVERSIONS for kernel-6.1"). list_projects() so ve projetos do `repo`;
          #     o kernel-6.1 (tarball) fica fora do mapa. O stamp.py (l.237) le este symlink e adiciona
          #     o kernel_rel a all_projects -> ai o setlocalversion roda no kernel-6.1 e le o .scmversion,
          #     e a chave STABLE_SCMVERSIONS["kernel-6.1"] passa a existir com -gd77c4cd65aed-ab14680598.
          echo "-gd77c4cd65aed" > kernel-6.1/.scmversion
          ln -sfn kernel-6.1 .source_date_epoch_dir
          # 🔑 --output_user_root manda a saida do Bazel pro volume do maximize-build-space (a raiz enche).
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          tools/bazel --output_user_root="$BZ" run --config=stamp --nokleaf_localversion "${{ inputs.target }}" -- --dist_dir="$PWD/dist" 2>&1 | tail -80
          rc=${PIPESTATUS[0]}
          echo "===== GROUND TRUTH: STABLE_SCMVERSIONS / EPOCHS que o Kleaf computou ====="
          cat bazel-out/stable-status.txt 2>/dev/null | grep -E 'SCMVERSION|SOURCE_DATE' || echo "(sem stable-status.txt)"
          echo "===== CONFIG_LOCALVERSION_AUTO no .config final (medir, nao supor) ====="
          find /mnt/build -name '.config' 2>/dev/null | xargs -r grep -l 'CONFIG_LOCALVERSION' 2>/dev/null | head -2 \
            | xargs -r grep -H 'LOCALVERSION_AUTO\|^CONFIG_LOCALVERSION=' 2>/dev/null || echo "(nao achou .config)"
          echo "===== localversion files gerados (o que o Kbuild concatena) ====="
          find /mnt/build -name 'localversion' 2>/dev/null | head -8 | while read f; do echo "$f => [$(cat "$f" 2>/dev/null)]"; done
          echo "--- disco depois do build:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: O que saiu
        if: always()
        run: |
          ls -lh "$WS/dist" 2>/dev/null || echo "sem dist/"
          find "$WS/dist" -maxdepth 1 -name "Image*" -o -maxdepth 1 -name "*.ko" 2>/dev/null | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-${{ inputs.mmi_tag }}
          path: |
            /mnt/build/ws/dist/Image*
            /mnt/build/ws/dist/*.gz
          if-no-files-found: warn
          retention-days: 14
